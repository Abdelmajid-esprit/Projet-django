<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#10233f">
    <title>{% block title %}TransConnect — Expéditions{% endblock %}</title>
    <style>
        :root {
            color-scheme: light;
            --navy: #10233f;
            --navy-soft: #1b3558;
            --teal: #087f8c;
            --teal-dark: #066873;
            --ink: #1e293b;
            --muted: #64748b;
            --line: #e2e8f0;
            --surface: #ffffff;
            --background: #f3f6fa;
            --danger: #b42332;
            --danger-dark: #8f1b28;
            --shadow: 0 18px 50px rgba(16, 35, 63, .09);
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            background:
                radial-gradient(ellipse at 85% 0%, rgba(8, 127, 140, .09), transparent 34rem),
                var(--background);
            color: var(--ink);
            font-family: Inter, "Segoe UI", Arial, sans-serif;
            line-height: 1.6;
        }

        a { color: var(--teal-dark); text-decoration: none; }
        a:hover { color: var(--navy); }

        .site-header {
            background: var(--navy);
            color: white;
            box-shadow: 0 4px 18px rgba(16, 35, 63, .16);
        }

        .header-inner, .page-shell, .footer-inner {
            width: min(1080px, calc(100% - 40px));
            margin: 0 auto;
        }

        .header-inner {
            min-height: 72px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 11px;
            color: white;
            font-size: 1.1rem;
            font-weight: 750;
            letter-spacing: -.02em;
        }

        .brand-mark {
            display: grid;
            width: 36px;
            height: 36px;
            place-items: center;
            border-radius: 11px;
            background: #10a3a6;
            color: white;
            font-size: .95rem;
        }

        .main-nav { display: flex; align-items: center; gap: 10px; }
        .main-nav a {
            padding: 8px 12px;
            border-radius: 8px;
            color: #dce7f3;
            font-size: .92rem;
            font-weight: 600;
        }
        .main-nav a:hover { background: rgba(255,255,255,.1); color: white; }
        .main-nav .nav-cta { background: #0e929b; color: white; }
        .main-nav .nav-cta:hover { background: #12a4ad; }

        .page-shell { padding: 54px 0 70px; }
        .page-heading { margin-bottom: 26px; }
        .eyebrow {
            margin: 0 0 8px;
            color: var(--teal-dark);
            font-size: .75rem;
            font-weight: 800;
            letter-spacing: .14em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            color: var(--navy);
            font-size: clamp(1.8rem, 4vw, 2.45rem);
            letter-spacing: -.045em;
            line-height: 1.2;
        }

        .subtitle { margin: 10px 0 0; color: var(--muted); }
        .panel {
            padding: clamp(22px, 4vw, 36px);
            border: 1px solid rgba(226, 232, 240, .9);
            border-radius: 18px;
            background: var(--surface);
            box-shadow: var(--shadow);
        }

        .expedition-list { display: grid; gap: 14px; margin: 0; padding: 0; list-style: none; }
        .expedition-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            padding: 19px 21px;
            border: 1px solid var(--line);
            border-radius: 13px;
            background: white;
            transition: border-color .18s ease, transform .18s ease, box-shadow .18s ease;
        }
        .expedition-card:hover {
            transform: translateY(-2px);
            border-color: #9bd5d8;
            box-shadow: 0 10px 24px rgba(16, 35, 63, .07);
        }
        .expedition-link { display: grid; flex: 1; gap: 3px; color: var(--navy); }
        .expedition-link strong { font-size: 1.04rem; }
        .expedition-link span { color: var(--muted); font-size: .9rem; }
        .arrow { color: var(--teal); font-size: 1.3rem; }

        .button-row { display: flex; flex-wrap: wrap; align-items: center; gap: 11px; margin-top: 24px; }
        .button {
            display: inline-flex;
            min-height: 43px;
            align-items: center;
            justify-content: center;
            padding: 10px 17px;
            border: 0;
            border-radius: 9px;
            background: var(--teal);
            color: white;
            cursor: pointer;
            font: inherit;
            font-size: .94rem;
            font-weight: 700;
            transition: background .18s ease, transform .18s ease;
        }
        .button:hover { transform: translateY(-1px); background: var(--teal-dark); color: white; }
        .button-secondary { border: 1px solid var(--line); background: white; color: var(--navy); }
        .button-secondary:hover { background: #f8fafc; color: var(--navy); }
        .button-danger { background: var(--danger); }
        .button-danger:hover { background: var(--danger-dark); }

        .empty-state {
            padding: 34px 20px;
            border: 1px dashed #cbd5e1;
            border-radius: 13px;
            color: var(--muted);
            text-align: center;
        }
        .detail-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
        .detail-item { padding: 16px; border-radius: 12px; background: #f7f9fc; }
        .detail-item dt {
            margin-bottom: 5px;
            color: var(--muted);
            font-size: .78rem;
            font-weight: 750;
            letter-spacing: .06em;
            text-transform: uppercase;
        }
        .detail-item dd { margin: 0; color: var(--navy); font-size: 1.04rem; font-weight: 650; }
        .status-pill {
            display: inline-flex;
            align-items: center;
            padding: 5px 11px;
            border-radius: 999px;
            background: #e6f5f3;
            color: #086c68;
            font-size: .88rem;
            font-weight: 750;
        }

        .form-panel form p { margin: 0 0 19px; }
        .form-panel label { display: block; margin-bottom: 7px; color: var(--navy); font-weight: 700; }
        .form-panel input:not([type="checkbox"]), .form-panel select, .form-panel textarea {
            width: 100%;
            min-height: 44px;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            background: white;
            color: var(--ink);
            font: inherit;
        }
        .form-panel textarea { min-height: 110px; }
        .form-panel input:focus, .form-panel select:focus, .form-panel textarea:focus {
            border-color: var(--teal);
            outline: 3px solid rgba(8, 127, 140, .13);
        }
        .form-panel .helptext { display: block; margin-top: 5px; color: var(--muted); font-size: .85rem; }
        .errorlist { margin: 6px 0; padding-left: 20px; color: var(--danger); font-size: .9rem; }

        .warning-box {
            padding: 16px 18px;
            border: 1px solid #f4d6a1;
            border-radius: 11px;
            background: #fff9eb;
            color: #754c0e;
        }

        .site-footer { border-top: 1px solid var(--line); background: rgba(255,255,255,.72); }
        .footer-inner { padding: 18px 0; color: var(--muted); font-size: .85rem; }

        @media (max-width: 600px) {
            .header-inner { min-height: 64px; flex-wrap: wrap; gap: 8px; padding: 12px 0; }
            .main-nav { width: 100%; justify-content: space-between; }
            .main-nav a { padding: 7px 9px; font-size: .85rem; }
            .page-shell { padding: 36px 0 50px; }
            .header-inner, .page-shell, .footer-inner { width: min(100% - 28px, 1080px); }
            .detail-grid { grid-template-columns: 1fr; }
            .expedition-card { padding: 16px; }
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <a class="brand" href="{% url 'ExpeditionApp:index' %}">
                <span class="brand-mark" aria-hidden="true">T</span>
                <span>TransConnect</span>
            </a>
            <nav class="main-nav" aria-label="Navigation principale">
                <a href="{% url 'ExpeditionApp:list' %}">Expéditions</a>
                <a class="nav-cta" href="{% url 'ExpeditionApp:create_expedition' %}">Nouvelle expédition</a>
            </nav>
        </div>
    </header>

    <main class="page-shell">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="footer-inner">TransConnect <span aria-hidden="true">·</span> Gestion des expéditions</div>
    </footer>
</body>
</html>
