<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — TransConnect</title>
    <style>
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            background: radial-gradient(circle at 20% 20%, rgba(8,127,140,.12), transparent 30rem), #f3f6fa;
            color: #1e293b;
            font-family: Inter, "Segoe UI", Arial, sans-serif;
        }
        .card {
            width: min(460px, calc(100% - 32px));
            padding: 38px;
            border: 1px solid #e2e8f0;
            border-radius: 18px;
            background: white;
            box-shadow: 0 18px 50px rgba(16,35,63,.11);
        }
        .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; color: #10233f; font-weight: 800; }
        .mark { display: grid; width: 38px; height: 38px; place-items: center; border-radius: 10px; background: #10a3a6; color: white; }
        h1 { margin: 0 0 7px; color: #10233f; font-size: 2rem; }
        .subtitle { margin: 0 0 24px; color: #64748b; }
        form p { margin: 0 0 16px; }
        label { display: block; margin-bottom: 6px; color: #10233f; font-weight: 700; }
        input { width: 100%; min-height: 44px; padding: 10px 12px; border: 1px solid #dce4ee; border-radius: 9px; font: inherit; }
        input:focus { border-color: #087f8c; outline: 3px solid rgba(8,127,140,.12); }
        .errorlist { margin: 5px 0; padding: 0; color: #b42332; list-style: none; }
        .submit { width: 100%; min-height: 46px; border: 0; border-radius: 9px; background: #087f8c; color: white; cursor: pointer; font: inherit; font-weight: 800; }
        .submit:hover { background: #066873; }
        .register { margin: 18px 0 0; color: #64748b; text-align: center; }
        a { color: #066873; font-weight: 700; text-decoration: none; }
    </style>
</head>
<body>
    <main class="card">
        <div class="brand"><span class="mark">T</span><span>TransConnect</span></div>
        <h1>Bon retour</h1>
        <p class="subtitle">Connectez-vous à votre espace TransConnect.</p>
        <form method="post">
            {% csrf_token %}
            {% if form.non_field_errors %}{{ form.non_field_errors }}{% endif %}
            {{ form.as_p }}
            {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
            <button class="submit" type="submit">Se connecter</button>
        </form>
        <p class="register">Pas encore de compte ? <a href="{% url 'register' %}">S'inscrire</a></p>
    </main>
</body>
</html>
