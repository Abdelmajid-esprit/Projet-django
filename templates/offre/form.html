{% extends "expedition/base.html" %}
{% block title %}{% if object %}Modifier{% else %}Nouvelle{% endif %} offre{% endblock %}
{% block content %}
<div class="page-heading"><p class="eyebrow">Gestion des offres</p><h1>{% if object %}Modifier l'offre{% else %}Créer une offre{% endif %}</h1></div>
<section class="panel form-panel"><form method="post">{% csrf_token %}{{ form.as_p }}<div class="button-row"><button class="button" type="submit">Enregistrer</button><a class="button button-secondary" href="{% url 'OffreApp:list' %}">Annuler</a></div></form></section>
{% endblock %}
